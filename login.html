<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGAMES - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-header">
            <h2><span class="highlight">G</span>GAMES</h2>
            <p>Masuk untuk mengunggah koleksi game impianmu</p>
        </div>

        <form action="indeks.html" class="login-form">
            <div class="input-group">
                <label for="email">Email / Username</label>
                <input type="text" id="email" placeholder="Masukkan email atau username" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Ingat Saya
                </label>
                <a href="#" class="forgot-pass">Lupa Password?</a>
            </div>

            <button type="submit" class="btn-login-submit">MASUK</button>
        </form>

        <div class="login-footer">
            <p>Belum punya akun? <a href="#">Daftar Sekarang</a></p>
        </div>
    </div>

</body>
</html>
